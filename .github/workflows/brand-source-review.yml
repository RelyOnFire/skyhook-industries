name: Brand asset preparation
on:
  push:
    branches: [brand-heritage-motion]
    paths: [.github/workflows/brand-source-review.yml, tools/prepare-owner-brand.py]
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install requests pillow numpy scipy
      - name: Prepare hash-pinned owner artwork as unreferenced Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prepare-owner-brand.py
      - uses: actions/upload-artifact@v4
        with:
          name: owner-brand-assets
          path: qa/owner-brand-assets/
          retention-days: 7
