name: Build

on:
  pull_request:
  push:
    branches: [main, site-rebuild]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install
      - name: Verify reference architecture model
        run: |
          python3 analysis/reference_architecture_v03.py > /tmp/reference_architecture_v03_output.md
          diff -u analysis/reference_architecture_v03_output.md /tmp/reference_architecture_v03_output.md
      - name: Build site
        run: npm run build
