name: Build

on:
  pull_request:
  push:
    branches: [main, site-rebuild]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install
      - name: Test Tether Lab numerical core
        run: npm run test:lab
      - name: Typecheck Tether Lab
        run: npm run check:lab
      - name: Verify legacy reference architecture outputs
        run: |
          python3 analysis/reference_architecture_v03.py > /tmp/reference_architecture_v03_output.md
          diff -u analysis/reference_architecture_v03_output.md /tmp/reference_architecture_v03_output.md
          python3 analysis/reference_architecture_v04.py > /tmp/reference_architecture_v04_output.md
          diff -u analysis/reference_architecture_v04_output.md /tmp/reference_architecture_v04_output.md
      - name: Build site
        run: npm run build
      - name: Package tracked source for reproducible browser review
        run: git archive --format=tar HEAD > source-review.tar
      - name: Upload browser-review build
        uses: actions/upload-artifact@v4
        with:
          name: site-review
          path: |
            dist/
            package-lock.json
            source-review.tar
          retention-days: 7
      - name: Package installed runtime for this offline QA pass
        run: |
          mkdir -p review-runtime
          cp "$(command -v node)" review-runtime/node
          tar -czf review-runtime.tgz node_modules package-lock.json review-runtime
      - name: Upload temporary QA runtime
        uses: actions/upload-artifact@v4
        with:
          name: offline-qa-runtime
          path: review-runtime.tgz
          retention-days: 1
