name: Build

on:
  pull_request:
  push:
    branches: [main, site-rebuild]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install
      - name: Audit release dependencies
        run: |
          npm audit --json > dependency-audit.json || audit_status=$?
          echo "Audit exit status: ${audit_status:-0}"
          node -e "const a=require('./dependency-audit.json'); if(!a.metadata || a.error || a.metadata.vulnerabilities.high || a.metadata.vulnerabilities.critical) process.exit(1)"
      - name: Test Tether Lab numerical core
        run: npm run test:lab
      - name: Typecheck Tether Lab
        run: npm run check:lab
      - name: Verify legacy reference architecture outputs
        run: |
          python3 analysis/reference_architecture_v03.py > /tmp/reference_architecture_v03_output.md
          diff -u analysis/reference_architecture_v03_output.md /tmp/reference_architecture_v03_output.md
          python3 analysis/reference_architecture_v04.py > /tmp/reference_architecture_v04_output.md
          diff -u analysis/reference_architecture_v04_output.md /tmp/reference_architecture_v04_output.md
      - name: Build site
        run: npm run build
      - name: Package tracked source for reproducible browser review
        if: always()
        run: git archive --format=tar HEAD > source-review.tar
      - name: Upload browser-review build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-review
          path: |
            dist/
            package-lock.json
            dependency-audit.json
            source-review.tar
          retention-days: 7
      - name: Install browser regression tooling
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Exercise native-origin Flight Studio and WebGL
        run: python3 tests/lab-flight-studio.browser.py --require-webgl
      - name: Exercise electrodynamic recovery and resource controls
        run: python3 tests/lab-electrodynamic.browser.py --require-webgl
      - name: Exercise Operations with native module workers and WebGL
        run: python3 tests/lab-operations.browser.py --require-webgl
      - name: Exercise consolidated routes, homepage and navigation
        run: python3 tests/site-release.browser.py
      - name: Upload browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: qa/browser/
          retention-days: 7
